<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal — Nirwana Infratech</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #3B6EF8;
    --blue-light: #5B8FFF;
    --cyan: #22D3EE;
    --dark: #080C1A;
    --dark2: #0E1525;
    --dark3: #141C32;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #F0F4FF;
    --text-muted: rgba(240,244,255,0.45);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background: var(--dark);
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
  }

  /* Animated background */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(59,110,248,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 90%, rgba(34,211,238,0.08) 0%, transparent 55%),
                var(--dark);
  }

  .grid-lines {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Animated orbs */
  .orb {
    position: fixed; border-radius: 50%;
    filter: blur(80px); pointer-events: none; z-index: 0;
    animation: float 8s ease-in-out infinite;
  }
  .orb1 { width: 350px; height: 350px; background: rgba(59,110,248,0.12); top: -100px; left: -80px; }
  .orb2 { width: 280px; height: 280px; background: rgba(34,211,238,0.07); bottom: -60px; right: -60px; animation-delay: -4s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-30px) scale(1.05); }
  }

  /* Card */
  .login-wrap {
    position: relative; z-index: 10;
    width: 100%; max-width: 440px;
    padding: 0 1.5rem;
  }

  .login-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 3rem 2.5rem 2.5rem;
    backdrop-filter: blur(24px);
    box-shadow:
      0 40px 100px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 1px 0 rgba(255,255,255,0.1) inset;
    animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(28px) scale(0.97); }
    to { opacity: 1; transform: none; }
  }

  /* Header */
  .card-header { text-align: center; margin-bottom: 2.5rem; }

  .logo-mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    border-radius: 20px;
    margin-bottom: 1.25rem;
    box-shadow: 0 12px 40px rgba(59,110,248,0.4);
    font-size: 1.5rem; color: white;
    position: relative;
  }
  .logo-mark::after {
    content: '';
    position: absolute; inset: -1px;
    border-radius: 21px;
    background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
    pointer-events: none;
  }

  .card-header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.5rem; font-weight: 800;
    color: var(--text); letter-spacing: -0.3px;
    margin-bottom: 0.35rem;
  }
  .card-header p {
    font-size: 0.82rem; color: var(--text-muted);
    font-weight: 300; letter-spacing: 0.3px;
  }

  /* Alert */
  .alert {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 12px;
    padding: 0.8rem 1rem;
    margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 10px;
    font-size: 0.83rem; color: #fca5a5;
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}
  }

  /* Form */
  .form-group { margin-bottom: 1.2rem; }

  .form-group label {
    display: block;
    font-size: 0.72rem; font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 0.5rem;
  }

  .input-wrap { position: relative; }
  .input-wrap .icon {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.2); font-size: 0.85rem;
    pointer-events: none; transition: color 0.2s;
  }
  .input-wrap input:focus ~ .icon,
  .input-wrap:focus-within .icon { color: var(--blue-light); }

  .input-wrap input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.09);
    border-radius: 14px;
    padding: 0.85rem 1rem 0.85rem 2.75rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem; color: var(--text);
    outline: none; transition: all 0.25s;
  }
  .input-wrap input::placeholder { color: rgba(255,255,255,0.2); }
  .input-wrap input:focus {
    border-color: var(--blue);
    background: rgba(59,110,248,0.08);
    box-shadow: 0 0 0 4px rgba(59,110,248,0.15);
  }

  .eye-toggle {
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,0.2); font-size: 0.85rem;
    transition: color 0.2s; padding: 0;
  }
  .eye-toggle:hover { color: var(--text-muted); }

  /* Submit */
  .submit-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--blue), var(--blue-light));
    border: none; border-radius: 14px;
    padding: 0.95rem;
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem; font-weight: 700;
    color: white; cursor: pointer;
    transition: all 0.25s;
    margin-top: 0.5rem;
    box-shadow: 0 8px 32px rgba(59,110,248,0.4);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    position: relative; overflow: hidden;
  }
  .submit-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0; transition: opacity 0.25s;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(59,110,248,0.5); }
  .submit-btn:hover::before { opacity: 1; }
  .submit-btn:active { transform: translateY(0); }

  /* Divider */
  .divider {
    display: flex; align-items: center; gap: 1rem;
    margin: 1.75rem 0 1.25rem;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1;
    height: 1px; background: var(--border);
  }
  .divider span { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }

  /* Back link */
  .back-link {
    text-align: center;
  }
  .back-link a {
    color: var(--text-muted); font-size: 0.83rem;
    text-decoration: none; transition: color 0.2s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .back-link a:hover { color: var(--text); }

  /* Security note */
  .security-note {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 1.5rem;
    font-size: 0.73rem; color: rgba(255,255,255,0.2);
  }
  .security-note i { font-size: 0.7rem; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid-lines"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="login-wrap">
  <div class="login-card">

    <div class="card-header">
      <div class="logo-mark"><i class="fas fa-shield-halved"></i></div>
      <h1>Admin Portal</h1>
      <p>Nirwana Infratech Engineering Pvt. Ltd.</p>
    </div>

    {% if messages %}
      {% for msg in messages %}
      <div class="alert">
        <i class="fas fa-triangle-exclamation"></i>
        {{ msg }}
      </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'admin_login' %}">
      {% csrf_token %}

      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <input type="text" name="username" placeholder="Enter your username" required autofocus autocomplete="username">
          <span class="icon"><i class="fas fa-user"></i></span>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" name="password" id="pwField" placeholder="Enter your password" required autocomplete="current-password">
          <span class="icon"><i class="fas fa-lock"></i></span>
          <button type="button" class="eye-toggle" onclick="togglePw()" id="eyeBtn">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn">
        <i class="fas fa-arrow-right-to-bracket"></i>
        Sign In to Dashboard
      </button>
    </form>

    <div class="divider"><span>or</span></div>

    <div class="back-link">
      <a href="{% url 'home' %}">
        <i class="fas fa-arrow-left"></i>
        Return to Website
      </a>
    </div>

    <div class="security-note">
      <i class="fas fa-lock"></i>
      Secured · Staff access only
    </div>
  </div>
</div>

<script>
function togglePw() {
  const f = document.getElementById('pwField');
  const i = document.getElementById('eyeIcon');
  if (f.type === 'password') {
    f.type = 'text';
    i.className = 'fas fa-eye-slash';
  } else {
    f.type = 'password';
    i.className = 'fas fa-eye';
  }
}
</script>
</body>
</html>
